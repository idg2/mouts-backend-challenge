# Work item: FEAT-021
# Builds the solution and runs the Unit suite on every pull request. Debug build: the Unit suite has known failures
# in Release (TD-045). The Integration and Functional suites need PostgreSQL and MongoDB and run locally.
name: Unit tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Ambev.DeveloperEvaluation.sln

      - name: Unit tests
        run: dotnet test tests/Ambev.DeveloperEvaluation.Unit --no-build
